name: Engine regression checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node scripts/sync-studio.mjs --check
      - run: node --check static/app.js && node --check static/scanner.js && node --check static/repair-review.js
      - run: node --experimental-strip-types --test tests/engine-reliability.test.cjs tests/training-gate.test.mjs tests/studio-ui.test.cjs tests/provider-runtime.test.cjs tests/narration-training.test.cjs tests/ai-settings.test.cjs tests/engine-coverage.test.cjs tests/reading-import.test.cjs tests/auth-flows.test.cjs tests/translation-quality.test.cjs tests/lm-studio.test.cjs
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_engine_reliability.py tests/test_narration_fidelity.py tests/test_translation_quality.py -q
